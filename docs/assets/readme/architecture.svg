<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
<title id="title">TraceX architecture</title><desc id="desc">A React browser calls the FastAPI control plane. A separate worker runs ingestion and analysis. API and worker coordinate through shared database metadata and an evidence volume. The appliance uses PostgreSQL and local files.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#242116" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#e3a62f"/></marker><linearGradient id="amber"><stop stop-color="#e3a62f"/><stop offset="1" stop-color="#e3a62f" stop-opacity=".25"/></linearGradient></defs>
<rect width="1400" height="600" rx="14" fill="#11110f"/><rect width="1400" height="600" rx="14" fill="url(#grid)"/><rect x=".5" y=".5" width="1399" height="599" rx="14" fill="none" stroke="#393227"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="50" y="46" font-size="11" letter-spacing="3" fill="#e3a62f">TRACEX / SYSTEM MAP</text><text x="50" y="83" font-size="29" font-weight="700" fill="#f3efe4">One local workflow. Separate responsibilities.</text><text x="1350" y="46" text-anchor="end" font-size="11" letter-spacing="2" fill="#a8a08c">APPLIANCE / POSTGRESQL + EVIDENCE VOLUME</text>
<rect x="50" y="140" width="265" height="363" rx="12" fill="#1b1914" stroke="#4e422c"/><text x="75" y="175" font-size="11" letter-spacing="2" fill="#e3a62f">01 / INVESTIGATOR</text><text x="75" y="212" font-size="25" font-weight="700" fill="#f3efe4">React console</text>
<g font-size="15" fill="#c9bea8"><text x="75" y="252">Case dashboard</text><text x="75" y="288">Evidence intake</text><text x="75" y="324">UTXO graph explorer</text><text x="75" y="360">Findings + group reviews</text><text x="75" y="396">Entities + network</text><text x="75" y="432">Evidence export</text></g><path d="M75 456H290" stroke="#393227"/><text x="75" y="482" font-size="12" fill="#9a9480">Self-hosted fonts and assets</text>
<rect x="385" y="140" width="435" height="240" rx="12" fill="#191b18" stroke="#46604b"/><text x="410" y="175" font-size="11" letter-spacing="2" fill="#9bb78b">02 / CONTROL PLANE</text><text x="410" y="212" font-size="25" font-weight="700" fill="#f3efe4">FastAPI API</text><text x="410" y="251" font-size="15" fill="#c9bea8">Authentication · case membership · streaming upload</text><text x="410" y="281" font-size="15" fill="#c9bea8">Bounded queries · versioned reviews · JSON exports</text><text x="410" y="311" font-size="15" fill="#c9bea8">Jobs · analysis state · replayable case events</text><text x="410" y="351" font-size="12" fill="#9a9480">Responsive request service / HTTP + SSE</text>
<rect x="860" y="140" width="490" height="240" rx="12" fill="#211b12" stroke="#705124"/><text x="885" y="175" font-size="11" letter-spacing="2" fill="#e3a62f">03 / ANALYSIS PROCESS</text><text x="885" y="212" font-size="25" font-weight="700" fill="#f3efe4">Durable worker</text><text x="885" y="251" font-size="15" fill="#c9bea8">Verify source → parse → normalize → commit receipts</text><text x="885" y="281" font-size="15" fill="#c9bea8">Build UTXO graph → detect patterns → rank anomalies</text><text x="885" y="311" font-size="15" fill="#c9bea8">Compute analytics → publish investigation groups</text><text x="885" y="351" font-size="12" fill="#9a9480">One service per host / bounded internal task pool</text>
<path d="M315 247H380" fill="none" stroke="#e3a62f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="349" y="231" text-anchor="middle" font-size="10" fill="#a8a08c">HTTP</text>
<path d="M603 380V429M1105 380V429" fill="none" stroke="#e3a62f" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="850" y="409" text-anchor="middle" font-size="11" letter-spacing="1" fill="#a8a08c">API + WORKER MEET IN SHARED METADATA AND FILES</text>
<rect x="385" y="435" width="965" height="105" rx="12" fill="#171817" stroke="#484b42"/><path d="M825 451V524" stroke="#393b32"/>
<text x="410" y="468" font-size="19" font-weight="700" fill="#f3efe4">PostgreSQL</text><text x="410" y="495" font-size="13" fill="#c9bea8">Cases · jobs · leases · receipts · stage state</text><text x="410" y="518" font-size="13" fill="#c9bea8">Findings · group membership · reviews · audit records</text>
<text x="850" y="468" font-size="19" font-weight="700" fill="#f3efe4">Evidence volume</text><text x="850" y="495" font-size="13" fill="#c9bea8">Original bytes · SHA-256 · canonical Parquet fragments</text><text x="850" y="518" font-size="13" fill="#c9bea8">DuckDB graph / analytics · compressed feature snapshots</text>
<text x="50" y="570" font-size="12" fill="#9a9480">Local analysis · CPU pipeline · prepared offline resources</text><text x="1350" y="570" text-anchor="end" font-size="12" fill="#e3a62f">ORIGINAL EVIDENCE → REVIEWABLE INTELLIGENCE</text>
</g></svg>
