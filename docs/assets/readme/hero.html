<script>
const NS='http://www.w3.org/2000/svg';
const names=['01 / ORIGINAL BYTES','02 / VERIFIED PREVOUTS','03 / PATTERN SIGNALS','04 / RECORDED DECISIONS'];
const specs=[['create-1',0,'#f0cc87'],['spend-1',.7,'#f0cc87'],['create-2',1.4,'#f0cc87'],['spend-2',2.1,'#f0cc87'],['continue',2.8,'#f0cc87'],['branch-1',.5,'#a2c1ca'],['branch-2',1.9,'#a2c1ca'],['branch-3',3.1,'#a2c1ca']];
const flows=specs.map(([id,delay,color])=>{const path=document.getElementById(id),length=path.getTotalLength();const group=document.createElementNS(NS,'g'),trail=document.createElementNS(NS,'path'),halo=document.createElementNS(NS,'circle'),dot=document.createElementNS(NS,'circle');trail.setAttribute('stroke',color);trail.setAttribute('stroke-width','2');trail.setAttribute('stroke-linecap','round');trail.setAttribute('fill','none');halo.setAttribute('r','4');halo.setAttribute('fill',color);halo.setAttribute('filter','url(#glow)');dot.setAttribute('r','1.8');dot.setAttribute('fill',color);group.append(trail,halo,dot);document.getElementById('particles').append(group);return {path,length,delay,group,trail,halo,dot}});
const nodes=Array.from(document.querySelectorAll('.node-border'));
function paint(time){const t=(time%12000)/1000;
  flows.forEach(({path,length,delay,group,trail,halo,dot})=>{const progress=((t-delay+12)%6)/6;const distance=progress*length;const point=path.getPointAtLength(distance);const start=path.getPointAtLength(Math.max(0,distance-12));const alpha=Math.min(1,progress*9,(1-progress)*9);group.setAttribute('opacity',String(alpha));trail.setAttribute('d',`M${start.x} ${start.y}L${point.x} ${point.y}`);trail.setAttribute('opacity','.45');for(const particle of [halo,dot]){particle.setAttribute('cx',point.x);particle.setAttribute('cy',point.y)}halo.setAttribute('opacity','.55')});
  nodes.forEach((node,i)=>{const energy=(1+Math.cos(2*Math.PI*(t/12-i/3)))/2;node.setAttribute('stroke',`rgb(${Math.round(101+energy*72)},${Math.round(89+energy*53)},${Math.round(56+energy*27)})`);node.setAttribute('stroke-width',String(1+energy*.35))});
  const stage=Math.floor(t/3)%4;document.querySelectorAll('.pill').forEach((p,i)=>p.classList.toggle('active',i===stage));document.getElementById('state').textContent=names[stage];
}
window.paint=paint;function animate(t){paint(t);requestAnimationFrame(animate)}document.fonts.ready.then(()=>new URLSearchParams(location.search).has('fixed')?paint(0):requestAnimationFrame(animate));
</script>
