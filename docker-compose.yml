services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracex
      POSTGRES_USER: tracex
      POSTGRES_PASSWORD: tracex-dev-only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracex -d tracex"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tracex_postgres:/var/lib/postgresql/data

volumes:
  tracex_postgres:
