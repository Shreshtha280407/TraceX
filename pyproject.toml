[project]
name = "tracex"
version = "0.1.0"
description = "Offline, evidence-first Bitcoin intelligence backend"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7,<1",
  "duckdb>=1.2,<2",
  "fastapi>=0.116,<1",
  "ijson>=3.3,<4",
  "pyarrow>=18,<24",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.43,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.12,<1"]
# scipy arrives transitively with scikit-learn, but app/ml imports it directly
# (poisson/nbinom/norm in detectors.py and fusion.py). A direct import belongs in
# the declared dependency set, or a future scikit-learn that drops or loosens the
# transitive pin breaks the stack with no warning.
ml = ["scikit-learn>=1.5,<2", "numpy>=1.26,<3", "scipy>=1.11,<2"]
# Isolated synthetic research comparators; never installed by the appliance's ml extra.
research = ["xgboost-cpu>=3,<4; platform_machine == 'x86_64'", "lightgbm>=4,<5"]

[project.scripts]
tracex-init-db = "app.db:init_database"
tracex-worker = "workers.runner:main"
tracex-geoip = "app.engine.geoip:main"
tracex-dataset = "app.engine.dataset_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "workers*"]

[tool.setuptools.package-data]
app = ["engine/calibration/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
