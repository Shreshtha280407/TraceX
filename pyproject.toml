[project]
name = "tracex"
version = "0.1.0"
description = "TraceX: evidence-first criminal-network intelligence backend (SIH 2026 PS 26189)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "neo4j>=5.25.0",
    "redis>=5.1.1",
    "minio>=7.2.9",
    "structlog>=24.4.0",
    "orjson>=3.10.7",
    "pypdf>=6.18.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pyjwt>=2.13.0",
    "pwdlib[argon2]>=0.3.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "numpy>=2.5.3",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "onnxruntime>=1.30.0",
    "pytesseract>=0.3.13",
]

# Swap the base "onnxruntime" dependency above for "onnxruntime-gpu" (same
# Python import name, mutually exclusive installs) on a host with a CUDA
# toolkit + compatible driver to enable GPU-accelerated detection -- see
# docs/architecture/media-processing-worker.md's "CPU/GPU behavior".
# `uv sync --extra gpu` alone does not swap onnxruntime for onnxruntime-gpu
# (both would install and Python would keep whichever wins import
# resolution); an operator wanting GPU support installs onnxruntime-gpu
# explicitly instead, e.g. `uv pip install onnxruntime-gpu`. This extra
# exists to document the package name and pin, not to be relied on as a
# drop-in `--extra` toggle.
[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.20.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.1",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["neo4j.*", "minio.*", "asyncpg.*", "openpyxl.*", "onnxruntime.*", "pytesseract.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
