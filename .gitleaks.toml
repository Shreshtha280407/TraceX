# Gap-Closure WP-8 (G14): gitleaks configuration for CI's secret-scan step.
#
# Extends gitleaks' own default ruleset (never replaces it) with one
# allowlist entry for a real, recurring, harmless false positive: this
# codebase's `idempotency_key` parameter/variable name superficially
# matches the built-in `generic-api-key` rule's regex (both contain
# "...potency_key" / "...i_key"-shaped substrings). Verified by running
# `gitleaks detect` against this repository's full history before adding
# this file -- exactly two matches, both `idempotency_key=` assignments
# in test fixtures, neither a real secret. This allowlist is scoped to
# that exact shape, not a blanket suppression of the `generic-api-key`
# rule.
title = "TraceX gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "idempotency_key assignments falsely matched by generic-api-key"
regexTarget = "line"
regexes = ['''(?i)idempotency.?key''']
